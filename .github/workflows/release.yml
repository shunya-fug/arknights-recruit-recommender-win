name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test
        run: dotnet test tests/ArknightsRecruitRecommender.Tests --configuration Release

      - name: Publish self-contained single-file exe
        run: >
          dotnet publish src/ArknightsRecruitRecommender
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output ./publish

      - name: Zip published output
        run: Compress-Archive -Path ./publish/* -DestinationPath ArknightsRecruitRecommender-${{ github.ref_name }}-win-x64.zip
        shell: pwsh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ArknightsRecruitRecommender-${{ github.ref_name }}-win-x64.zip
          generate_release_notes: true
