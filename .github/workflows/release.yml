name: Release

on:
  push:
    tags:
      - "v*"
  # オペレーターデータの自動更新(update-operator-data.yml)から、タグを指定して呼び出すため。
  # ワークフローのトークンで打ったタグでは、上のpushトリガーが起動しない(GitHubの仕様)。
  workflow_dispatch: {}

jobs:
  build-and-release:
    # 手動実行でタグ以外(ブランチ)を指定された場合は、リリースを作らない。
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test
        run: dotnet test tests/ArknightsRecruitRecommender.Tests --configuration Release

      - name: Determine version from tag
        id: version
        shell: pwsh
        run: echo "version=$($env:GITHUB_REF_NAME.TrimStart('v'))" >> $env:GITHUB_OUTPUT

      - name: Publish self-contained single-file exe
        run: >
          dotnet publish src/ArknightsRecruitRecommender
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.version.outputs.version }}
          --output ./publish

      - name: Zip published output
        run: Compress-Archive -Path ./publish/* -DestinationPath ArknightsRecruitRecommender-${{ github.ref_name }}-win-x64.zip
        shell: pwsh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ArknightsRecruitRecommender-${{ github.ref_name }}-win-x64.zip
          generate_release_notes: true
